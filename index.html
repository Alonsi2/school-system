<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - نظام إدارة المدرسة</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans">

  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-blue-900 mb-6">نظام إدارة المدرسة</h2>
    
    <div id="errorBox" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 text-sm text-center"></div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">الرقم التعريفي</label>
        <input type="text" id="nationalId" required placeholder="أدخل الرقم التعريفي"
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-right">
      </div>

      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">كلمة المرور</label>
        <input type="password" id="password" required placeholder="••••••••"
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-right">
      </div>

      <button type="submit" id="submitBtn"
        class="w-full bg-blue-900 text-white py-2 rounded-lg hover:bg-blue-800 transition font-bold">
        تسجيل الدخول
      </button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nationalId = document.getElementById('nationalId').value;
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('errorBox');
      const submitBtn = document.getElementById('submitBtn');

      errorBox.classList.add('hidden');
      submitBtn.textContent = 'جاري تسجيل الدخول...';
      submitBtn.disabled = true;

      try {
        const res = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nationalId, password })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.message || 'خطأ في بيانات الدخول');

        localStorage.setItem('userId', data.userId);
        localStorage.setItem('role', data.role);
        localStorage.setItem('userName', data.name);

        if (data.role === 'admin') window.location.href = 'admin.html';
        else if (data.role === 'principal' || data.role === 'assistant') window.location.href = 'principal.html';
        else if (data.role === 'teacher') window.location.href = 'teacher.html';
        else if (data.role === 'student') window.location.href = 'student.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('hidden');
      } finally {
        submitBtn.textContent = 'تسجيل الدخول';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
